name: Fortnite skin watcher

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:          # кнопка ручного запуска для теста

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check shop
        id: shop
        env:
          SKIN_NAME: "Jinx"                       # <- название скина по-английски
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # <- берётся из Secrets
        run: python check_once.py

      # Когда скин найден, выключаем слежение, чтобы пуши не приходили повторно
      - name: Stop after found
        if: steps.shop.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"

      # Раз в ~30 дней делаем служебный коммит, чтобы GitHub не отключил расписание
      - name: Keepalive
        if: steps.shop.outputs.found != 'true'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            mkdir -p .github
            date -u > .github/keepalive.txt
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "keepalive"
            git push
          fi
